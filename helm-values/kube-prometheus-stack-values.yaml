commonLabels:
  environment: dev
  project: eks-platform
  managed-by: terraform

grafana:
  ingress:
    enabled: false
  service:
    type: ClusterIP
  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3-observability
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  defaultDashboardsTimezone: browser
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

prometheus:
  ingress:
    enabled: false
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-observability
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

alertmanager:
  ingress:
    enabled: false
  alertmanagerSpec:
    storage: {}
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
